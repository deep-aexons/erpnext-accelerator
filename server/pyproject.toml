[project]
name = "erpnext-mcp"
version = "0.2.0"
description = "MCP server that connects Claude to ERPNext (part of the erpnext-accelerator plugin)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
erpnext-mcp = "erpnext_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erpnext_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
